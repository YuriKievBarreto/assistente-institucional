services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-assistente-institucional
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_assistente:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: postgres-assistente-institucional
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data_assistente:/var/lib/postgresql/data 

volumes:
  qdrant_data_assistente:
  postgres_data_assistente: