services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-assistente-instituicional
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_assistente:/qdrant/storage

  redis:
    image: redis/redis-stack:latest
    container_name: redis-assistente-instituicional
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data_assistente:/data
    environment:
      - REDIS_ARGS=--appendonly yes

volumes:
  qdrant_data_assistente:
  redis_data_assistente: