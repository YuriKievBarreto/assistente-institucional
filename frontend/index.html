<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual IFPB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Aplica o tema salvo o mais cedo possível, antes do primeiro paint,
     pra não "piscar" claro e depois escurecer. Fica inline de propósito
     (não pode esperar o main.js como módulo, que carrega depois). -->
<script>
    (function () {
        const saved = localStorage.getItem('ifpb-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>

<!-- MODAL AUTH -->
<div class="modal-overlay" id="modal-auth">
    <div class="modal-box">
        <button class="modal-close" id="modal-close"><i class="ti ti-x"></i></button>

        <div class="modal-logo">
            <img src="https://www.ifpb.edu.br/static/media/logo.20d47050.png" alt="IFPB">
        </div>

        <div class="modal-tabs">
            <button class="modal-tab active" id="tab-login">Entrar</button>
            <button class="modal-tab" id="tab-register">Criar conta</button>
        </div>

        <!-- LOGIN -->
        <form class="auth-form" id="form-login">
            <div>
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="seu@email.com" required>
            </div>
            <div>
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <p class="auth-error" id="auth-error"></p>
            <button type="submit" class="auth-submit">Entrar</button>
        </form>

        <!-- REGISTER -->
        <form class="auth-form" id="form-register" style="display:none">
            <div>
                <label for="register-name">Nome</label>
                <input type="text" id="register-name" placeholder="Seu nome" required>
            </div>
            <div>
                <label for="register-email">Email</label>
                <input type="email" id="register-email" placeholder="seu@email.com" required>
            </div>
            <div>
                <label for="register-password">Senha</label>
                <input type="password" id="register-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-submit">Criar conta</button>
        </form>
    </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="ifpb-logo-wrap">
            <img src="https://www.ifpb.edu.br/static/media/logo.20d47050.png" alt="Logo IFPB">
        </div>
        <div class="sidebar-tagline">Assistente Virtual Institucional</div>
    </div>

    <div style="height:14px;"></div>
    <button class="new-chat-btn" id="new-chat-btn">
        <i class="ti ti-plus" aria-hidden="true"></i>
        Nova conversa
    </button>

    <div class="sidebar-section-label">Recentes</div>
    <div class="chat-history" id="chat-history"></div>

    <div class="sidebar-footer">
        <button id="profile-btn" style="width:100%;background:none;border:none;cursor:pointer;padding:0;text-align:left;">
            <div class="user-profile">
                <div class="profile-avatar" id="profile-avatar">U</div>
                <div style="flex:1;">
                    <div class="profile-name" id="profile-name">Usuário</div>
                    <div class="profile-role" id="profile-role">Clique para entrar</div>
                </div>
                <i class="ti ti-logout" id="logout-icon" style="display:none;color:#ffffff50;font-size:16px;flex-shrink:0;" title="Sair"></i>
            </div>
        </button>
    </div>
</div>

<!-- MAIN -->
<div class="main">
    <div class="main-header">
        <div class="main-header-left">
            <div class="header-icon">
                <i class="ti ti-robot" aria-hidden="true"></i>
            </div>
            <div>
                <div class="header-title">Assistente Virtual IFPB</div>
                <div class="header-subtitle">Tire dúvidas, busque informações e muito mais</div>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="online-badge">
                <span class="online-dot"></span>
                Online
            </div>
            <div class="header-actions">
                <button class="icon-btn theme-toggle" id="theme-toggle" title="Alternar tema" type="button">
                    <i class="ti ti-sun" aria-hidden="true"></i>
                    <i class="ti ti-moon-stars" aria-hidden="true"></i>
                </button>
                <button class="icon-btn" title="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chat-box"></div>

    <form class="chat-input-area" id="chat-form">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar mensagem">
                <i class="ti ti-send" aria-hidden="true"></i>
            </button>
        </div>
        <div class="input-hint">Assistente do Instituto Federal da Paraíba · As respostas podem conter erros. Verifique informações importantes.</div>
    </form>
</div>

<script src="main.js" type="module"></script>
</body>
</html>
