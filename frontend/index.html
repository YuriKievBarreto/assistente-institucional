<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual IFPB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #00000060;
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: var(--bg-white);
            border-radius: 16px;
            width: 380px;
            padding: 32px 28px 28px;
            position: relative;
            box-shadow: 0 8px 40px #00000030;
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: none; border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            display: flex; align-items: center;
        }
        .modal-close:hover { color: var(--text-dark); }

        .modal-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-surface);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .modal-tab {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .modal-tab.active {
            background: var(--bg-white);
            color: var(--ifpb-green);
            box-shadow: 0 1px 4px #00000015;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-mid);
            margin-bottom: 4px;
            display: block;
        }

        .auth-form input {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-dark);
            background: var(--bg-surface);
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .auth-form input:focus {
            border-color: var(--ifpb-green-mid);
            background: var(--bg-white);
        }

        .auth-submit {
            width: 100%;
            padding: 11px;
            background: var(--ifpb-green);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .auth-submit:hover { background: var(--ifpb-green-dark); }

        .auth-error {
            font-size: 12px;
            color: var(--ifpb-red);
            min-height: 16px;
            text-align: center;
        }

        .modal-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .modal-logo img {
            height: 36px;
        }
    </style>
</head>
<body>

<!-- MODAL AUTH -->
<div class="modal-overlay" id="modal-auth">
    <div class="modal-box">
        <button class="modal-close" id="modal-close"><i class="ti ti-x"></i></button>

        <div class="modal-logo">
            <img src="https://www.ifpb.edu.br/static/media/logo.20d47050.png" alt="IFPB">
        </div>

        <div class="modal-tabs">
            <button class="modal-tab active" id="tab-login">Entrar</button>
            <button class="modal-tab" id="tab-register">Criar conta</button>
        </div>

        <!-- LOGIN -->
        <form class="auth-form" id="form-login">
            <div>
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="seu@email.com" required>
            </div>
            <div>
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <p class="auth-error" id="auth-error"></p>
            <button type="submit" class="auth-submit">Entrar</button>
        </form>

        <!-- REGISTER -->
        <form class="auth-form" id="form-register" style="display:none">
            <div>
                <label for="register-name">Nome</label>
                <input type="text" id="register-name" placeholder="Seu nome" required>
            </div>
            <div>
                <label for="register-email">Email</label>
                <input type="email" id="register-email" placeholder="seu@email.com" required>
            </div>
            <div>
                <label for="register-password">Senha</label>
                <input type="password" id="register-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-submit">Criar conta</button>
        </form>
    </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="ifpb-logo-wrap">
            <img src="https://www.ifpb.edu.br/static/media/logo.20d47050.png" alt="Logo IFPB">
        </div>
        <div class="sidebar-tagline">Assistente Virtual Institucional</div>
    </div>

    <div style="height:14px;"></div>
    <button class="new-chat-btn" id="new-chat-btn">
        <i class="ti ti-plus" aria-hidden="true"></i>
        Nova conversa
    </button>

    <div class="sidebar-section-label">Recentes</div>
    <div class="chat-history" id="chat-history"></div>

    <div class="sidebar-footer">
        <button id="profile-btn" style="width:100%;background:none;border:none;cursor:pointer;padding:0;text-align:left;">
            <div class="user-profile">
                <div class="profile-avatar" id="profile-avatar">U</div>
                <div style="flex:1;">
                    <div class="profile-name" id="profile-name">Usuário</div>
                    <div class="profile-role" id="profile-role">Clique para entrar</div>
                </div>
                <i class="ti ti-logout" id="logout-icon" style="display:none;color:#ffffff50;font-size:16px;flex-shrink:0;" title="Sair"></i>
            </div>
        </button>
    </div>
</div>

<!-- MAIN -->
<div class="main">
    <div class="main-header">
        <div class="main-header-left">
            <div class="header-icon">
                <i class="ti ti-robot" aria-hidden="true"></i>
            </div>
            <div>
                <div class="header-title">Assistente Virtual IFPB</div>
                <div class="header-subtitle">Tire dúvidas, busque informações e muito mais</div>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="online-badge">
                <span class="online-dot"></span>
                Online
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chat-box"></div>

    <form class="chat-input-area" id="chat-form">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar mensagem">
                <i class="ti ti-send" aria-hidden="true"></i>
            </button>
        </div>
        <div class="input-hint">Assistente do Instituto Federal da Paraíba · As respostas podem conter erros. Verifique informações importantes.</div>
    </form>
</div>

<script src="script.js" type="module"></script>
</body>
</html>
